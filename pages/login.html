<!DOCTYPE html>

<html>

<style>
	input {
		width: 11%;
		margin: 5px
	}

	button {
		width: 5%;
		margin: 5px
	}

</style>

<head>
	<link rel="stylesheet" href="../fonts.css">
	<link rel="stylesheet" href="../global.css">
</head>

<body style="background-color: var(--body-color); color: var(--accent-color); margin: 0px; font-family: Geo">

	<p style="text-align: center; font-size: 2rem; margin: 0px; position: absolute; bottom: 0%">TwixOs</p>

	<div class="flex" style="width: 100vw; height: 100vh; margin: auto;">
		<p style="text-align: center; font-size: 1.5rem; margin: 10px">Please enter your username.</p>
		<input id="inputUsername" placeholder="Username" maxlength="20">
		<input id="inputPassword" placeholder="Password (doesn't actually matter)" type="password">
		<button id="loginButton" onclick="updateUsername()">
			Login
		</button>
	</div>

	<audio id="clickSound" src="../sounds/click.mp3"></audio>

	<script>
		const audioPlayer = document.getElementById("clickSound")

		document.onkeypress = function(e) {
			e = e || window.event;
			if (document.activeElement.nodeName == 'INPUT') {
				audioPlayer.play()
			}
		};

	</script>

	<script src="../javascript/login.js"></script>

</body>

</html>
